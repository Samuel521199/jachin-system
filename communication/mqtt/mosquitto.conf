# Mosquitto MQTT Broker Configuration

# Listener on default port
listener 1883
protocol mqtt

# WebSocket listener
listener 9001
protocol websockets

# Allow anonymous connections (change in production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection logging
connection_messages true

# Topic access control (optional)
# acl_file /mosquitto/config/acl.conf

# Password file (optional, for production)
# password_file /mosquitto/config/passwd
