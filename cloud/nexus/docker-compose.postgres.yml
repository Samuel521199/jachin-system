# 本地一键 PostgreSQL，与 .env.example 默认账号一致
# 使用: cd cloud/nexus && docker compose -f docker-compose.postgres.yml up -d
# DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - nexus_pg_data:/var/lib/postgresql/data

volumes:
  nexus_pg_data:
