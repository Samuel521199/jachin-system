# PMO 多维表变更监控（防抖轮询 → Lark 回调）
# 写出路径：~/.jachin/config/skills/pmo-copilot/pmo_bitable_watch.yaml
#
# 也可用环境变量覆盖：PMO_CHANGE_ALERT_CHAT_ID / PMO_CHANGE_ALERT_MONITOR_CHAT_ID /
# PMO_BITABLE_WATCH_* / PMO_MONITOR_CHAT_ID 等（优先读项目根 .env）

enabled: true

# webhook = 飞书 Lark 推送 drive.file.bitable_record_changed_v1
# poll = 兜底每 N 秒拉全表 diff
# hybrid = 长连接 + poll（推荐生产）
mode: hybrid

# 监控目标：K11 同一张 Bitable · 人员任务看板（变更回调 SSOT）
# table=tblfK9gk6vTQpJtB & view=vewCz1FFJi（人员矩阵 / Worker B B-4）
table_id: tblfK9gk6vTQpJtB
view_id: vewCz1FFJi

wiki_url: "https://ssgkm409t6q5.sg.larksuite.com/wiki/B19Iww8tBiXZqfky1hhlIZ6kg0P?table=tblfK9gk6vTQpJtB&view=vewCz1FFJi"

# 变更回调群聊（oc_ 开头为飞书群 chat_id；优先读项目根 .env）
chat_id: "${PMO_CHANGE_ALERT_CHAT_ID}"
monitor_chat_id: "${PMO_CHANGE_ALERT_MONITOR_CHAT_ID}"

# 双应用分工：Bitable 长连接/拉表 cli_a9253a96…；推群/对话 IM cli_aaad309a…
app_id: cli_a9253a96b179deee
app_secret: xzIhCMJgbaAu0XGo7zjI9cHiTjbc7Azj
notify_app_id: cli_aaad309a98795ed1
notify_app_secret: k07F7armnlQBOUezl0RmV7Yna2MS6wqk

# 人类连续编辑防抖：idle_seconds 无新事件则结束会话并回调
idle_seconds: 20
debounce_check_seconds: 5
poll_interval_seconds: 15

max_records: 5000

push_change_summary: false
change_alert_push_monitor: false
run_change_alert: true
persist_local: true

# 事件驱动长连接：python scripts/run_pmo_bitable_watch_long_connection.py --domain lark
# Windows 后台：.\scripts\start_pmo_bitable_watch_daemon.ps1

