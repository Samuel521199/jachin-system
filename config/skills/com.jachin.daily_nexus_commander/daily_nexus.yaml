# Daily Nexus Commander — 默认配置（可被 ~/.jachin/config/.../daily_nexus.yaml 覆盖）
# 首次运行 scripts/run_daily_nexus.py 若用户目录无配置，会从本文件复制到 ~/.jachin

weather_city: "上海"

# 详细运行日志目录（Windows 默认 D:\zzz\jachin\健康skill）；可用环境变量 DAILY_NEXUS_LOG_DIR 覆盖
log_dir: "D:\\zzz\\jachin\\健康skill"
# log_level: DEBUG
# log_copy_latest: false   # true 时额外覆盖 daily_nexus_latest.log

# reply_only：只打印/写文件，不调用飞书推送
# lark：推送至飞书（需 config/mcps/atom_lark_notifier 或 BI_LARK_WEBHOOK_URL / default_chat_id）
notify_channel: "reply_only"

# 可选：显式 Webhook（不填则用 atom_lark_notifier 配置与环境变量）
lark_webhook_url: ""

sqlite_snippets: []
# 示例（表名需与你 my_life_data.db 一致）:
# sqlite_snippets:
#   - name: "表一览"
#     sql: "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name LIMIT 20;"

reminders: []
