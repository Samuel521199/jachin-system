# BI 每日战报配置
# 规范: .cursor/rules/075-config-root-and-cloud-sync.mdc
# 实际配置: ~/.jachin/config/skills/com.jachin.bi.daily_report/

# skip_collect: 仅在 DuckDB+raw 已「今日新鲜」时跳过 SPA 抓取；不新鲜时仍会抓。完整流程建议 false。
skip_collect: false

# 数据分析数据来源: "raw"=从 raw 目录 slug CSV（战略分析、仪表盘 LLM 摘要）；lark"=从 Lark 多维表拉取
# 战略分析 strategic_report、仪表盘大数据分析 dashboard_automation 均读此开关
analysis_data_source: "raw"

# run_refiner: false 时跳过 Step2 提纯，不生成 output CSV（Lark 同步无新文件）。完整流程须 true。
run_refiner: true

# ========== 定时开关（可随意调节） ==========
# schedule_enabled: 顶层开关，false 时完全关闭 BI 定时任务（不注册、不启动）
# 也可在下方 schedule.enabled 中设置，两者任一为 false 即关闭
# 配置路径（优先 ~/.jachin，再到项目 config）:
#   bi_daily_report.yaml — 主配置（本段 + schedule）
#   bi_scheduler.yaml — 可选，仅覆盖 schedule_enabled / schedule，见同目录 bi_scheduler.yaml.example
# 环境变量（可选）: BI_DAILY_REPORT_SCHEDULE=off — 强制关定时，不改 YAML
# 定时排查日志: ~/.jachin/client_volumes/bi_data/logs/bi_scheduler_audit.log
schedule_enabled: false

# ========== 调度配置 ==========
# 改每天触发时间：cron 模式下改 hour / minute（24 小时制，上海时区见 timezone）
# mode: cron — 每天固定时刻一次；interval — 每 N 分/小时；loop — 调试用循环
# 定时触发时 Windows 会弹出新控制台窗口跑完整战报（等同 python scripts/run_bi_daily_report.py）
schedule:
  enabled: false
  mode: cron
  hour: 14
  minute: 13
  timezone: Asia/Shanghai
  # —— 仅 mode: loop 时生效（一般不用）——
  # run_at_hour: 15
  # run_at_minute: 30
  # interval_seconds: 3600

# ========== 数据源 ==========
data_source:
  url: "${BI_DATA_URL}"
  extract_rules: {}
  headers: {}

# ========== SPA 批量抓取（Chrome CDP）==========
# use_direct_urls: true 且 direct_urls 非空时，按 slug 直链打开页面，避免侧栏菜单不可见导致失败
# base_url / cdp_url 可用 .env 的 BI_DATA_URL、BI_SPA_CDP_URL（需在 .env 中配置）
# report_date_end: "2026-03-24"  # 可选；不填则默认昨天。各表「统计日期」结束日与此一致后点查询/对比查询
# 实际生效配置请同步: ~/.jachin/config/skills/com.jachin.bi.daily_report/bi_daily_report.yaml
