    "22_漏斗_Tongits_King_老用户.csv": "vewBNmeNKJ"
  app_id: "cli_a930e0054ecf5ed1"
  app_secret: "Unl7WW162ZCJdb1E0nKMZgXcSxRqRcvs"
  app_token: "HCvubvsubak2WPs2GbClYq68gjh"
  ensure_columns: true    # 改为 true 可自动建列，解决 01_用户活跃_增幅表 FieldNameNotFound
  # true：同步前 batch_delete 清空该子表再写入（每日战报默认）。需应用具备删除记录权限。
  # 若本机 ~/.jachin 同名 YAML 曾写 replace_table: false，加载配置时仍以「项目本文件」为 true 则强制整表覆盖（见 _merge_lark_bitable_replace_from_project_yaml）
