storage:
  base_path: "client_volumes/bi_data"
  # 提纯 CSV 输出目录，供 Lark 多维表格导入
  # 留空或未配置：默认 ~/.jachin/client_volumes/bi_data/output
  # 可填绝对路径（如 /data/bi_output 或 D:\\bi_output），或相对 ~/.jachin 的路径
  refiner_output_path: ""
  # analysis_data_source=raw 时：从此目录读 {slug}.csv；留空则 ~/.jachin/client_volumes/bi_data/raw（Windows 本机常为 C:\Users\<用户名>\.jachin\client_volumes\bi_data\raw）
  analysis_raw_dir: ""

# Lark 多维表格同步（与 Lark 侧栏结构一一对应）
# app_id/app_secret 优先；未配置时从 .env 的 BI_LARK_APP_ID/LARK_APP_ID 读取；应用需 base:record 权限
# ensure_columns: true 时自动创建缺失列，解决 FieldNameNotFound；false 时表需预建且字段名与 CSV 完全一致
# text_columns: 指定必须按文本发送的列，避免纯数字 SKU 导致 TextFieldConvFail（11/10 表已内置）
# field_mapping: 当 Lark 表字段名与 CSV 不一致时，可配置列名映射
# 若 DAU和DNU 表使用「增量」而非「增幅」: field_mapping: {"01_用户活跃_增幅表.csv": {"增幅":"增量"}}
lark_bitable:
  enabled: true
  # sg.larksuite.com 等国际域名用 Lark 开放平台 open.larksuite.com；飞书中国版才设为 true
  lark_use_feishu: false
