  lark_webhook_url: "${BI_LARK_WEBHOOK_URL}"
  # BI 机器人所在会话 chat_id（无 Webhook 时用 IM API；Lark↔终端镜像也使用此 ID）
  lark_chat_id: "oc_bb2b468cb04acb709c2e7aa5683f8f08"
  # 邮件通知（Step 3.6，调用 mcp:atom_email_sender 一次性发送给所有收件人）
  email:
    enabled: true
    # 定时发送时间（HH:MM），留空则生成后立即发送；填写则等到该时刻再发（可手动修改）
    scheduled_time: ""
    smtp_host: "smtp.qq.com"
