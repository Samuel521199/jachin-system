  replace_table: false    # 不先清空表，直接追加（避免 delete 权限 Forbidden）
  # CSV 文件 -> table_id（在 Lark 中打开子表，URL ?table=tblXXX 即 table_id）
  # 表名与 Lark 多维表格侧栏一一对应，填对应子表的 table_id
  # 当 Lark 表字段名与 CSV 不一致时，可配置 field_mapping。05 表 CSV 列为「文本, 留存率」；06 表为「类型, 留存率（%）」；07 表为「类型, 留存率」
