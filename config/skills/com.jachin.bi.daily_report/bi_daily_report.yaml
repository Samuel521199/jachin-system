# 结合菲律宾社交游戏市场，基于 DuckDB 指标与 CSV 提纯数据调用 LLM 生成战报
strategic_report:
  enabled: true
  push_to_lark: true   # 生成后推送到 distribution.lark_chat_id 或 lark_webhook_url

# 仪表盘自动化：分析统计图 + 设置 Lark 定时发送（Step 4）
# 数据分析发送结束后马上开始 Playwright 配置，填入的定时时间由此配置读取（可手动修改）
# cdp_url 留空时自动启动 Playwright 浏览器（首次需手动登录 Lark，之后复用会话）；填 127.0.0.1:9222 则连接已有 Chrome
dashboard_automation:
  enabled: true
  # 仪表盘定时发送时间（HH:MM），填入 Lark「设置自动化发送」的定时触发，可手动修改
  scheduled_time: "20:00"
  timezone: Asia/Shanghai
  cdp_url: ""   # 留空=自动启动浏览器；填 http://127.0.0.1:9222 则连接已有 Chrome
  # 分析 MD 文档保存子目录，相对于 output（如 统计分析 → output/统计分析）
  analysis_output_subdir: "统计分析"
  # 三个仪表盘的完整 URL（在 Lark 中打开对应仪表盘后从地址栏复制）
