# Ray 集群配置
# Ray Cluster Configuration

# Ray 模式
mode: "single"  # single, cluster

# Ray Head 节点配置
head:
  host: "localhost"
  port: 10001
  dashboard_port: 8265
  dashboard_host: "0.0.0.0"
  
# Ray Worker 节点配置
worker:
  auto_scale: true
  min_workers: 1
  max_workers: 10
  resources_per_worker:
    CPU: 1
    memory: 2  # GB
    GPU: 0

# 任务配置
task:
  default_timeout: 300  # 秒
  max_retries: 3
  retry_delay: 5  # 秒
  
# 资源监控
monitoring:
  enable: true
  metrics_port: 8080
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR

# 对象存储
object_store:
  memory_limit_gb: 4
  object_spilling_config:
    type: "filesystem"
    params:
      directory_path: "/tmp/ray_spill"

# 运行时环境
runtime_env:
  pip:
    - "ray[default]>=2.8.0"
  env_vars:
    RAY_DISABLE_IMPORT_WARNING: "1"
