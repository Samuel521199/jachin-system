id: com.jachin.pdf-to-text
version: 1.0.0
name: PDF 转文本
description: 将 PDF 文件转换为纯文本，供简历解析等后续处理使用
author: HR Plugin Team

capabilities:
  - name: pdf_to_text
    description: 将 PDF 文件转换为纯文本
    compute: cpu_light
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: PDF 文件路径（需在 ~/.jachin/workspace/ 内）
        page_range:
          type: string
          description: 页码范围，如 "1-5" 或 "1,3,5"，空则全部
          default: ""
      required:
        - path
    output_schema:
      type: object
      properties:
        text:
          type: string
          description: 提取的文本内容
        page_count:
          type: integer
          description: 总页数

permissions:
  - id: file
    label: 文件
    scope: file.read

requirements:
  - pypdf2
  - pdfplumber

runtime:
  type: ray
  python_version: "3.10"
  resources: {}
