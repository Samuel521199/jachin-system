id: com.jachin.docx-parser
version: 1.0.0
name: Word 简历解析
description: 解析 .docx 格式的 Word 文档，提取正文文本
author: HR Plugin Team

capabilities:
  - name: parse_docx
    description: 解析 Word 文档获取纯文本
    compute: cpu_light
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: .docx 文件路径
      required:
        - path
    output_schema:
      type: object
      properties:
        text:
          type: string
        paragraphs:
          type: array
          items:
            type: string

permissions:
  - id: file
    label: 文件
    scope: file.read

requirements:
  - python-docx

runtime:
  type: ray
  python_version: "3.10"
  resources: {}
