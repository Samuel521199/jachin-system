# Qdrant 向量数据库 - Docker 独立配置
# 数据挂载到实际硬盘，持久化保存
#
# 用法:
#   # 设置数据目录（可选，默认见下方）
#   $env:JACHIN_QDRANT_DATA = "D:\docker\volumes\qdrant_data"   # Windows
#   export JACHIN_QDRANT_DATA="/data/qdrant"                    # Linux/macOS
#   docker-compose -f docker-compose.qdrant.yml up -d

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jachin-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - ${JACHIN_QDRANT_DATA:-./qdrant_storage}:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
