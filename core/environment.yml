name: jachin-system
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  # Python 版本
  - python=3.11

  # 核心依赖
  - pip
  - pip:
    # FastAPI 和 Web 框架
    - fastapi>=0.104.0
    - uvicorn[standard]>=0.24.0
    - pydantic>=2.5.0
    - pydantic-settings>=2.1.0

    # LLM Providers
    - dashscope>=1.17.0  # 阿里云 Qwen
    - httpx>=0.25.0      # Local LLM (OpenAI-compatible)

    # Database
    - sqlalchemy>=2.0.23
    - alembic>=1.12.1
    - asyncpg>=0.29.0    # PostgreSQL async driver
    - psycopg2-binary>=2.9.9  # PostgreSQL sync driver

    # Vector Database
    - qdrant-client>=1.7.0  # Qdrant vector database client

    # Redis
    - redis>=5.0.1
    - hiredis>=2.2.3

    # Dapr
    - dapr>=1.11.0  # Dapr Python SDK

    # MQTT
    - paho-mqtt>=1.6.1

    # WebSocket
    - websockets>=12.0

    # gRPC
    - grpcio>=1.60.0
    - grpcio-tools>=1.60.0
    - protobuf>=4.25.1

    # Utilities
    - python-dotenv>=1.0.0
    - psutil>=5.9.0      # 遥测：CPU/内存采集
    - python-multipart>=0.0.6
    - aiofiles>=23.2.1

    # Logging
    - structlog>=23.2.0

    # Testing
    - pytest>=7.4.3
    - pytest-asyncio>=0.21.1
    - pytest-cov>=4.1.0

  # CUDA 和深度学习（可选，根据需要取消注释）
  # - pytorch>=2.1.0
  # - torchvision>=0.16.0
  # - torchaudio>=2.1.0
  # - pytorch-cuda=12.1  # 或 11.8，根据你的 CUDA 版本
  # - cudatoolkit=12.1  # 如果需要

  # 其他常用工具
  - jupyter
  - ipython
  - black  # 代码格式化
  - flake8  # 代码检查
  - mypy  # 类型检查
