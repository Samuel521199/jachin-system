services:
  postgres:
    image: postgres:16-alpine
    container_name: jachin-l1-postgres
    environment:
      POSTGRES_DB: jachin_nexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jachin_nexus"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: jachin-l1-migrate:latest
    container_name: jachin-l1-migrate
    env_file:
      - l1.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

  nexus:
    image: jachin-l1:latest
    container_name: jachin-l1-nexus
    ports:
      - "3000:3000"
    env_file:
      - l1.env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: "production"
    volumes:
      - ./data/packages:/app/public/packages
      - ./data/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
