# 开发环境 Docker Compose 配置
# 注意：Docker Compose v2+ 不再需要 version 字段
# 仅包含基础设施服务，后端代码在本地 Conda 环境中运行
# 
# 注意：PostgreSQL 和 Qdrant 使用本地安装的版本，不在 Docker 中运行
# 请确保本地已安装并运行：
#   - PostgreSQL 15+ (端口 5432)
#   - Qdrant (端口 6333/6334)
# 参考 docs/LOCAL_DATABASE_SETUP.md 了解本地数据库配置说明
#
# 项目名称：使用环境变量 COMPOSE_PROJECT_NAME=jachin-dev 或通过 -p 参数指定

services:
  # PostgreSQL 数据库 - 已禁用，使用本地 PostgreSQL
  # postgres:
