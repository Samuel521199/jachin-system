# V2 架构说明：L2 使用 SQLite，无需 PostgreSQL/Qdrant/Redis/Dapr/Ray。
# 以下服务为可选（L1 Cloud 或旧版开发环境）。
services:
  # PostgreSQL 数据库（L1 Cloud 使用；L2 用 SQLite）
  postgres:
    image: postgres:15-alpine
    container_name: jachin-postgres
    environment:
      POSTGRES_DB: jachin_brain
      POSTGRES_USER: jachin
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jachin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jachin-network

  # 向量数据库：Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jachin-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jachin-network

  # Redis (用于缓存和消息队列)
  redis:
    image: redis:7-alpine
    container_name: jachin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - jachin-network

  # MQTT Broker (用于 IoT 通信)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: jachin-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./communication/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jachin-network

  # Dapr Placement (用于 Actor 模式，可选)
  dapr-placement:
    image: "daprio/dapr:latest"
    container_name: jachin-dapr-placement
    command: ["./placement", "-port", "50005"]
    ports:
      - "50005:50005"
    networks:
      - jachin-network

  # Zipkin (用于分布式追踪，可选)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: jachin-zipkin
    ports:
      - "9412:9411"  # 使用9412端口避免与dapr_zipkin冲突
    networks:
      - jachin-network

  # Ray Head (分布式计算集群头节点，可选)
  ray-head:
    image: rayproject/ray:latest
    container_name: jachin-ray-head
    command: sh -c "ray start --head --dashboard-port=8265 --disable-usage-stats && tail -f /dev/null"
    ports:
      - "10001:10001"  # Ray client port (auto-assigned by Ray)
      - "8265:8265"    # Ray Dashboard
    volumes:
      - ray_data:/tmp/ray
    shm_size: 4gb  # 增加共享内存以提升性能（Ray 建议至少 4.74GB，设置为 4GB 以获得最佳性能）
    restart: always  # 容器退出时自动重启
    networks:
      - jachin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8265"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API (Python FastAPI) with Dapr Sidecar
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: jachin-core
    ports:
      - "8001:8000"
      - "3500:3500"  # Dapr HTTP API
      - "50001:50001"  # Dapr gRPC API
    environment:
      - DATABASE_URL=postgresql://jachin:secure_password@postgres:5432/jachin_brain
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_GRPC_URL=http://qdrant:6334
      - REDIS_URL=redis://redis:6379
      - MQTT_BROKER=mqtt://mqtt:1883
      - LLM_PROVIDER=qwen
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - APP_PORT=8000
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
    volumes:
      - ./core:/app
      - ./dapr/components:/dapr/components
      - ./dapr/config:/dapr/config
      - ./dapr/secrets:/dapr/secrets
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      dapr-placement:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - jachin-network

  # Dapr Sidecar for Core
  core-dapr:
    image: "daprio/dapr:latest"
    container_name: jachin-core-dapr
    command: ["./daprd",
      "-app-id", "core",
      "-app-port", "8000",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-components-path", "/dapr/components",
      "-config", "/dapr/config/config.yaml",
      "-placement-host-address", "dapr-placement:50005",
      "-log-level", "info"]
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
      dapr-placement:
        condition: service_started
    network_mode: "service:core"
    volumes:
      - ./dapr/components:/dapr/components
      - ./dapr/config:/dapr/config
      - ./dapr/secrets:/dapr/secrets

volumes:
  # 使用E盘存储volumes数据
  # Volumes are stored on E: drive to save C: drive space
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\docker\volumes\postgres_data
  qdrant_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\docker\volumes\qdrant_data
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\docker\volumes\redis_data
  mqtt_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\docker\volumes\mqtt_data
  mqtt_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\docker\volumes\mqtt_logs
  ray_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\docker\volumes\ray_data

networks:
  jachin-network:
    name: jachin-network
    driver: bridge
