apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
  namespace: default
spec:
  type: secretstores.local.file
  version: v1
  metadata:
    # Use absolute path or relative path from project root
    # Windows: Use forward slashes or escaped backslashes
    - name: secretsFile
      value: "dapr/secrets/secrets.json"  # Relative to project root where dapr run is executed
    - name: nestedSeparator
      value: ":"
