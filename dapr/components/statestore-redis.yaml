apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: default
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: localhost:6379  # 指向 jachin-redis-dev（通过端口映射）
    - name: redisPassword
      value: ""  # Redis 默认无密码
    - name: enableTLS
      value: "false"
    - name: maxRetries
      value: "3"
    - name: maxRetryBackoff
      value: "2000"  # 毫秒数，不是时间字符串
