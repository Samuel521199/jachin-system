[package]
name = "jachin-desktop"
version = "0.9.55"
description = "Jachin-System Desktop Console"
authors = ["Jachin Team"]
license = ""
repository = ""
edition = "2021"
# 与 [[bin]] jachin-updater-helper 并存时须指定默认目标，否则 `cargo run` / `tauri dev` 报错
default-run = "jachin-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-notification = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
whoami = "1.4"
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
sysinfo = "0.30"
ort = { version = "2.0.0-rc.11", default-features = true, features = ["ndarray"], optional = true }
ndarray = { version = "0.16", optional = true }
cpal = { version = "0.15", optional = true }
rubato = { version = "0.14", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
hound = { version = "3.5", optional = true }
directories = "5.0"
async-trait = "0.1"
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
ctrlc = "3.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
minisign-verify = "0.2"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "jachin-updater-helper"
path = "src/bin/jachin_updater_helper.rs"

[features]
default = []
tts-local = ["dep:ort", "dep:ndarray"]
# 全天候陪伴：cpal + 重采样(rubato) + Silero-VAD(ort) + 线程通道(crossbeam-channel)
ambient = ["dep:cpal", "dep:rubato", "dep:ort", "dep:ndarray", "dep:crossbeam-channel", "dep:hound"]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
