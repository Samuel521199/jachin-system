# Windows linker policy for Jachin Desktop.
#
# The default MSVC link.exe can fail on this machine with LNK1105 / error 1224
# while closing Rust build-script executables. Plain rust-lld avoids that lock
# path, but can crash when producing debug info. The stable local combination is:
#   rust-lld + debuginfo=0
#
# Keep this project-local so it does not affect other Rust workspaces.

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "debuginfo=0"]
