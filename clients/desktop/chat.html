<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230c4a6e' width='32' height='32' rx='6'/><path fill='%2322d3ee' d='M8 10h16v2H8zm0 5h12v2H8zm0 5h14v2H8z'/></svg>" />
    <title>Jachin Chat</title>
    <style>
      /* 全透明：避免在浅色桌面前出现整块发灰的「空气墙」；交互仍由 Omni 毛玻璃舱承接 */
      html, body {
        margin: 0;
        padding: 0;
        background: transparent !important;
        /* 不可 overflow:hidden：会裁切 Omni 下方 absolute 流式面板 */
        overflow-x: hidden;
        overflow-y: visible;
        pointer-events: auto;
      }
      #chat-root {
        width: 100%;
        min-width: 100%;
        min-height: 0;
        height: 100%;
        overflow: visible;
        background: transparent !important;
        pointer-events: auto !important;
      }
      #chat-root input,
      #chat-root button,
      #chat-root label,
      #chat-root [data-chat-interactive] {
        pointer-events: auto !important;
      }
      #chat-root input {
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="chat-root"></div>
    <script type="module" src="/src/chat.tsx"></script>
  </body>
</html>
