<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230c4a6e' width='32' height='32' rx='6'/><path fill='%2322d3ee' d='M8 10h16v2H8zm0 5h12v2H8zm0 5h14v2H8z'/></svg>" />
    <title>Jachin Chat</title>
    <style>
      /* 全透明：避免在浅色桌面前出现整块发灰的「空气墙」；交互仍由 Omni 毛玻璃舱承接 */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        box-sizing: border-box;
        background: transparent !important;
        overflow: hidden;
        pointer-events: auto;
      }
      /* body 上若被第三方脚本插入兄弟节点，会撑高文档并挤压 #chat-root；用 flex 把视口高度只分给根节点 */
      body {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      /* 流式/长文滚动在 Omni 内部 flex 子树完成，根节点锁高度避免挤出输入栏 */
      #chat-root {
        width: 100%;
        min-width: 100%;
        flex: 1 1 0;
        min-height: 0;
        max-height: 100%;
        overflow: hidden;
        background: transparent !important;
        pointer-events: auto !important;
        display: flex;
        flex-direction: column;
      }
      #chat-root input,
      #chat-root button,
      #chat-root label,
      #chat-root [data-chat-interactive] {
        pointer-events: auto !important;
      }
      #chat-root input {
        user-select: text;
      }
      /* 陪伴态 CSS 沙盒（主 SSOT：src/styles/globals.css COMPANION MODE STYLES） */
      body.companion-mode,
      html.companion-mode body {
        overflow: visible !important;
      }
      body.companion-mode #chat-root {
        overflow: visible !important;
        max-height: none !important;
      }
    </style>
  </head>
  <body>
    <div id="chat-root"></div>
    <script type="module" src="/src/chat.tsx"></script>
  </body>
</html>
