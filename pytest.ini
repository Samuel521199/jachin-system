[pytest]
# Pytest configuration (ASCII-only: Windows may read this file with system encoding, not UTF-8)

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: unit tests
    integration: integration tests
    e2e: end-to-end tests
    slow: slow tests
    requires_db: requires database
    requires_docker: requires Docker
    requires_ray: requires Ray

asyncio_mode = auto

addopts =
    -v
    --strict-markers
    --tb=short
    --cov=core
    --cov-report=term-missing
    --cov-report=html

norecursedirs = .git .venv venv env __pycache__ .pytest_cache

filterwarnings =
    ignore:The model sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 now uses mean pooling.*:UserWarning
    ignore:getargs.*The 'u' format is deprecated.*:DeprecationWarning
