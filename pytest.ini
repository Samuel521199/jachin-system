[pytest]
# pytest配置文件
# Pytest Configuration File

# 测试目录
testpaths = tests

# Python文件模式
python_files = test_*.py

# Python类模式
python_classes = Test*

# Python函数模式
python_functions = test_*

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试
    requires_db: 需要数据库
    requires_docker: 需要Docker
    requires_ray: 需要Ray

# 异步测试配置
asyncio_mode = auto

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=core
    --cov-report=term-missing
    --cov-report=html

# 忽略目录
norecursedirs = .git .venv venv env __pycache__ .pytest_cache
