name: Build L3 macOS Binary

# 触发方式：
#   1. 手动触发（在 GitHub Actions 页面点 "Run workflow"）
#   2. 推送 v* 标签时自动构建并挂到 Release
on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        required: true
        default: 'both'
        type: choice
        options:
          - both          # arm64 (Apple Silicon M1/M2/M3) + x86_64 (Intel)
          - arm64         # Apple Silicon 专用
          - x86_64        # Intel Mac 专用
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3) — macos-14 = arm64
          - arch: arm64
            runner: macos-14
            triple: aarch64-apple-darwin
            skip_if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.arch == 'x86_64' }}
          # Intel Mac — macos-13 = x86_64
          - arch: x86_64
            runner: macos-13
            triple: x86_64-apple-darwin
            skip_if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.arch == 'arm64' }}

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Skip check
        if: ${{ matrix.skip_if }}
        run: |
          echo "Skipping ${{ matrix.arch }} (not selected)"
          exit 0

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # macOS 系统依赖（pyaudio 需要 PortAudio）
      - name: Install system dependencies (Homebrew)
        run: |
          brew install portaudio || true

      - name: Install PyInstaller
        run: pip install pyinstaller

      # 安装 L3 依赖；pywin32 已在 requirements.txt 中用 sys_platform 条件排除
      # pvporcupine / pyaudio 等有原生依赖的包安装失败时跳过（PyInstaller 只打实际导入的模块）
      - name: Install L3 dependencies
        run: |
          pip install --upgrade pip
          # 先尝试全量安装
          pip install -r core/requirements.txt || {
            echo "[WARN] Full install failed, falling back to per-package install (ignore optional failures)"
            while IFS= read -r line; do
              # 跳过注释和空行
              [[ "$line" =~ ^#|^[[:space:]]*$ ]] && continue
              # 跳过已知 Windows-only 的包（sys_platform 条件 pip 应自动处理，此处双重保险）
              [[ "$line" =~ pywin32 ]] && continue
              pkg=$(echo "$line" | sed 's/;.*//' | sed 's/[[:space:]]//g')
              pip install "$pkg" || echo "[SKIP] $pkg install failed (optional)"
            done < core/requirements.txt
          }

      # fastembed 需要单独安装（拉取 ONNX 模型权重，首次较慢）
      - name: Install fastembed
        run: pip install fastembed || echo "[SKIP] fastembed optional"

      # playwright 需要额外安装 Chromium 浏览器
      - name: Install Playwright browser (Chromium)
        run: |
          pip install playwright || true
          playwright install chromium || true

      - name: Build L3 sidecar (PyInstaller)
        run: python scripts/build_l3_sidecar.py --force

      # 验证产出文件
      - name: Verify binary
        run: |
          BINARY="clients/desktop/src-tauri/bin/l3_node-${{ matrix.triple }}"
          if [ -f "$BINARY" ]; then
            echo "[OK] Binary: $BINARY"
            ls -lh "$BINARY"
            file "$BINARY"
          else
            echo "[ERR] Binary not found: $BINARY"
            ls -la clients/desktop/src-tauri/bin/ || true
            exit 1
          fi

      # 上传为 Actions Artifact（可在 Actions 页面直接下载，保留 30 天）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: l3-node-${{ matrix.triple }}
          path: clients/desktop/src-tauri/bin/l3_node-${{ matrix.triple }}
          retention-days: 30
          if-no-files-found: error

      # 推送 tag 时自动附加到 GitHub Release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: clients/desktop/src-tauri/bin/l3_node-${{ matrix.triple }}
          # 不覆盖已有 Release，仅追加文件
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
