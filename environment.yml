name: jachin-dev
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python 版本
  - python=3.10

  # PyTorch 和 CUDA（适配 Nvidia DGX）
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1  # 适配 Nvidia DGX Spark 128G

  # 包管理
  - pip

  # Python 依赖（通过 pip）
  - pip:
    # Web 框架
    - fastapi>=0.104.0
    - uvicorn[standard]>=0.24.0
    - pydantic>=2.5.0
    - pydantic-settings>=2.1.0

    # LLM Providers
    - dashscope>=1.17.0  # 阿里云 Qwen SDK
    - modelscope>=1.9.0  # 阿里系模型工具
    - httpx>=0.25.0      # Local LLM (OpenAI-compatible)

    # Database
    - sqlalchemy>=2.0.23
    - alembic>=1.12.1
    - asyncpg>=0.29.0    # PostgreSQL async driver
    - psycopg2-binary>=2.9.9  # PostgreSQL sync driver

    # Vector (LanceDB)
    - lancedb>=0.3.0

    # Redis
    - redis>=5.0.1
    - hiredis>=2.2.3

    # Dapr
    - dapr>=1.11.0  # Dapr Python SDK
    - dapr-ext-grpc>=1.11.0  # Dapr gRPC 扩展

    # MQTT
    - paho-mqtt>=1.6.1

    # WebSocket
    - websockets>=12.0

    # gRPC
    - grpcio>=1.60.0
    - grpcio-tools>=1.60.0
    - protobuf>=4.25.1

    # GPU 监控 (NVML)
    - nvidia-ml-py>=12.0.0

    # Utilities
    - python-dotenv>=1.0.0
    - python-multipart>=0.0.6
    - aiofiles>=23.2.1

    # Logging
    - structlog>=23.2.0

    # Testing
    - pytest>=7.4.3
    - pytest-asyncio>=0.21.1
    - pytest-cov>=4.1.0

  # 开发工具
  - jupyter
  - ipython
  - black  # 代码格式化
  - flake8  # 代码检查
  - mypy  # 类型检查
